name: secret-scan

# Also enforced locally via .pre-commit-config.yaml. This runs it for
# contributors who skip the local hook.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit on the branch, not just
          # the tip. Depth 0 is required for --log-opts to see anything.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
