# ─── Test Architecture ───────────────────────────────────────────────────────

test_strategy:
  approach: "Outside-in + Contract-heavy"
  pattern: "Slice-based integration tests (test_slice0_ through test_slice15_)"
  isolation_model: |
    HTTP layer: REAL (httpx.AsyncClient + ASGITransport)
    Middleware: REAL (all 4 middleware run in actual order)
    Route handlers: REAL (execute with real logic)
    JWT: REAL (JWTTokenHandler with test secret)
    Redis: fakeredis (FakeStrictRedis, full API-compatible)
    DB: PATCHED at module boundary (src.Util.db.*)
    Cache manager: PATCHED
    Activity/Audit loggers: PATCHED/SPY

  db_patching_policy: |
    DB functions are patched at their USAGE location (import namespace), not source.
    DBPatcher class in integration/conftest.py provides context-manager for bulk patching.
    Default patches list covers 40+ DB function names.
    Rationale: MySQL stored procedures require real MySQL 8.0 instance — not available in test env.

  env_isolation: |
    .env.test loaded by tests/conftest.py BEFORE any src.* import.
    Prevents db_config.py from creating live Redis connection at import time.
    JWT_SECRET_KEY, DEBUG_MODE, LOG_TOKEN_USER, LOG_TOKEN_REALM all overridden.

# ─── Recommended Commands ────────────────────────────────────────────────────

recommended_commands:
  run_all: pytest
  run_unit: pytest tests/unit -v
  run_integration: pytest tests/integration -v
  run_e2e: pytest tests/e2e -v
  run_single: pytest tests/integration/test_slice2_auth_login.py -v
  run_slice: pytest tests/integration/test_slice{N}_*.py -v
  coverage: pytest --cov=src --cov-report=term-missing --cov-report=html
  coverage_fail: pytest --cov=src --cov-fail-under=80
  coverage_unit_json: pytest --cov=src --cov-report=json:.coverage-unit.json
  deprecation_check: pytest -W error::DeprecationWarning
  watch: pytest -x --lf
  collect_only: pytest tests/integration/ --collect-only

