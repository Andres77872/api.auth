# ─── External Dependencies ───────────────────────────────────────────────────

external_dependencies:
  database:
    type: mysql
    driver: pymysql (synchronous)
    pattern: Stored procedures for ALL operations
    test_strategy: "Patch at module boundary — no real DB in tests"
    future_need: "docker-compose with MySQL 8.0 for true E2E"

  cache:
    type: redis
    driver: redis-py (synchronous)
    test_strategy: "fakeredis.FakeStrictRedis — full API-compatible"
    patch_locations:
      - src.Util.db_config.redis_client
      - src.Util.cache_manager.redis_client
      - src.Util.db.db_enhanced.client
      - src.Util.db.db_users.client
      - src.Util.db.db_session_analytics.redis_client
      - src.Util.system_metrics.redis_client
      - src.routes.auth.redis_client

  auth:
    jwt_library: python-jose + PyJWT (RSA + HS256)
    password_hash: argon2-cffi
    session_storage: 'redis (key pattern: "session:*")'

# ─── Architecture ────────────────────────────────────────────────────────────

architecture:
  pattern: "Layered (routes → middleware → Util/db → MySQL/Redis)"
  entrypoint: src/main.py
  routes: 14 modules (auth, users, projects, admin, roles, permissions, system, bulk, audit_logs)
  middleware: 6 modules (auth_context, authentication, api_audit, error_handler, request_validation, activity_logging)
  utilities: 20 modules (db, JWT, security, cache, logging, models)
  db_layer: 11 modules (enhanced, users, projects, user_groups, project_groups, roles, permissions, analytics, audit, error_logger, global_roles)

  key_patterns:
    - "Groups-of-groups: USER → USER_GROUP → PROJECT_GROUP → PROJECTS"
    - "Three user types: root, admin, consumer"
    - "UUID-based identifiers (usr-{UUID4}, proj-{UUID4})"
    - "Form data for most endpoints, JSON for bulk operations"
    - "Response format: {success, message, data}"
    - "Redis session caching with key pattern 'session:*'"
    - "MySQL stored procedures for all DB operations"
    - "Middleware stack: CORS → RequestValidation → APIAudit → AuthContext"
    - "Activity logging and API audit as background tasks"

# ─── Constraints ─────────────────────────────────────────────────────────────

constraints:
  - "Tests MUST NOT hit production DB/Redis — .env.test isolation handles this"
  - "Sync DB/Redis drivers (pymysql, redis-py) block event loop — test perf impact"
  - "JWT_SECRET_KEY from .env must be overridden in test fixtures (handled by conftest.py)"
  - "DB patching must target import location, not source definition"
  - "fakeredis is NOT a mock — it implements full Redis API in-memory"
  - "src/main.py reads ./src/README.md at import time — tests must run from project root"
  - "Filename conventions violate PEP 8 (Seccurity.py, JWT_Security.py, Models.py)"

# ─── Risks ───────────────────────────────────────────────────────────────────

risks:
  - "HIGH: 44% coverage — 56% of codebase untested, including critical auth middleware (11%)"
  - "HIGH: No CI/CD — no automated gate, tests only run locally"
  - "MEDIUM: Sync drivers will slow any future real-DB test suite"
  - "MEDIUM: DB patching at module boundary may miss direct submodule imports"
  - "MEDIUM: No mutation testing — false positives in test assertions undetected"
  - "LOW: No rate limiting on login endpoint (documented, not fixed)"
  - "LOW: Inconsistent auth check patterns across routes (documented, not fixed)"

# ─── Next Steps ──────────────────────────────────────────────────────────────

next_steps:
