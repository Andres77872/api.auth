# SDD Project Context — api.auth
# Generated: 2026-04-16
# DO NOT EDIT MANIFEST FIELDS. Re-run init to refresh.

project:
  name: api.auth
  description: "Group-Based Multi-Project Authentication System with hierarchical RBAC"
  version: "2.2.0"
  default_branch: master

stack:
  language: Python 3.12
  framework: FastAPI 0.115.14
  server: Uvicorn 0.34.3
  validation: Pydantic 2.11.7
  database:
    primary: MySQL (PyMySQL 1.1.1)
    cache: Redis 6.2.0
  auth:
    - PyJWT 2.10.1
    - python-jose 3.5.0
    - argon2-cffi 25.1.0
  security:
    - cryptography 45.0.4
    - email_validator 2.2.0
  async: aiohttp 3.12.13
  container: Docker (python:3.12 base)

testing:
  framework: pytest >= 8.0
  plugins:
    - pytest-cov >= 5.0
    - pytest-asyncio >= 0.24 (auto mode)
    - httpx >= 0.27
    - fakeredis >= 2.26
    - freezegun >= 1.5
    - python-dotenv >= 1.0
  config: pytest.ini
  layers:
    unit: tests/unit/ (12 test files — utilities, models, security)
    integration: tests/integration/ (17 test files — slice-based, conftest.py)
    e2e: tests/e2e/ (1 test file — API lifecycle)
  fixtures: tests/conftest.py (mock_redis, mock_db_connection, jwt_secret, frozen_time, debug_mode_on/off)
  env: .env.test loaded BEFORE any src.* import

architecture:
  pattern: "Layered (routes → middleware → Util/db → MySQL/Redis)"
  entrypoint: src/main.py
  layers:
    routes: src/routes/ (12 route modules — auth, users, projects, admin, roles, permissions, system, bulk)
    middleware: src/middleware/ (6 middleware modules — auth_context, authentication, api_audit, error_handler, request_validation, activity_logging)
    utilities: src/Util/ (20 utility modules — db, JWT, security, cache, logging, models)
    database: src/Util/db/ (11 db modules — enhanced, users, projects, user_groups, project_groups, roles, permissions, analytics)
  schemas: schemas/ (tables/, stored_procedures/, triggers/, docs/)
  scripts: scripts/ (create_database.py, recreate_database.py)
  docs: docs/ (USAGE/, findings/)

cicd:
  detected: none
  note: "No GitHub Actions, GitLab CI, or Jenkinsfile detected"

linting:
  detected: none
  note: "No ESLint, Prettier, Biome, golangci-lint, or ruff detected"

monorepo: false

convention_registry:
  agents: []
  conventions: []
  note: "No convention files found (agents.md, AGENTS.md, CLAUDE.md, .cursorrules, GEMINI.md, copilot-instructions.md)"

env:
  development: .env
  testing: .env.test
  note: "conftest.py loads .env.test BEFORE any src.* import to prevent live Redis connections"

key_patterns:
  - "Slice-based integration tests (test_slice0_ through test_slice14_)"
  - "UUID-based identifiers (usr-{UUID4}, proj-{UUID4})"
  - "Form data for most endpoints, JSON for bulk operations"
  - "Response format: {success, message, data}"
  - "Three user types: root, admin, consumer"
  - "Groups-of-groups architecture: USER → USER_GROUP → PROJECT_GROUP → PROJECTS"
  - "Redis-based session caching with fakeredis for tests"
  - "MySQL stored procedures for database operations"
  - "Middleware stack: AuthContext → APIAudit → RequestValidation → CORS"
  - "Activity logging and API audit as background tasks"
