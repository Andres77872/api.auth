# docker-compose.test.yml — isolated e2e runner + MySQL 8.0 + Redis
#
# Usage:
#   bash scripts/run-e2e.sh
#   docker compose -f docker-compose.test.yml down -v

services:
  mysql-test:
    image: mysql:8.0
    container_name: api-auth-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: test_root
      MYSQL_DATABASE: magic_auth
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_mysql_password
    ports:
      - "3307:3306"
    volumes:
      - ./schemas/tables/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql
      - ./schemas/tables/02_create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql
      - ./schemas/tables/03_create_indexes.sql:/docker-entrypoint-initdb.d/03_create_indexes.sql
      - ./schemas/tables/04_add_constraints.sql:/docker-entrypoint-initdb.d/04_add_constraints.sql
      - ./schemas/tables/05_initialize_data.sql:/docker-entrypoint-initdb.d/05_initialize_data.sql
      - ./schemas/tables/06_create_views.sql:/docker-entrypoint-initdb.d/06_create_views.sql
      - ./schemas/tables/07_error_logs.sql:/docker-entrypoint-initdb.d/07_error_logs.sql
      - ./schemas/tables/08_activity_logging_tables.sql:/docker-entrypoint-initdb.d/08_activity_logging_tables.sql
      - ./schemas/tables/09_email_activation_tables.sql:/docker-entrypoint-initdb.d/09_email_activation_tables.sql
      - ./schemas/tables/10_external_accounts.sql:/docker-entrypoint-initdb.d/10_external_accounts.sql
      - ./schemas/tables/11_patreon_entitlements.sql:/docker-entrypoint-initdb.d/10_patreon_entitlements.sql
      - ./schemas/stored_procedures/01_user_management.sql:/docker-entrypoint-initdb.d/10_sp_01_user_management.sql
      - ./schemas/stored_procedures/02_user_groups.sql:/docker-entrypoint-initdb.d/11_sp_02_user_groups.sql
      - ./schemas/stored_procedures/03_projects.sql:/docker-entrypoint-initdb.d/12_sp_03_projects.sql
      - ./schemas/stored_procedures/04_project_groups.sql:/docker-entrypoint-initdb.d/13_sp_04_project_groups.sql
      - ./schemas/stored_procedures/05_global_roles.sql:/docker-entrypoint-initdb.d/14_sp_05_global_roles.sql
      - ./schemas/stored_procedures/06_permission_assignments.sql:/docker-entrypoint-initdb.d/15_sp_06_permission_assignments.sql
      - ./schemas/stored_procedures/07_sessions_analytics.sql:/docker-entrypoint-initdb.d/16_sp_07_sessions_analytics.sql
      - ./schemas/stored_procedures/08_admin_operations.sql:/docker-entrypoint-initdb.d/17_sp_08_admin_operations.sql
      - ./schemas/stored_procedures/09_system_maintenance.sql:/docker-entrypoint-initdb.d/18_sp_09_system_maintenance.sql
      - ./schemas/stored_procedures/10_error_logging.sql:/docker-entrypoint-initdb.d/19_sp_10_error_logging.sql
      - ./schemas/stored_procedures/11_activity_logging.sql:/docker-entrypoint-initdb.d/20_sp_11_activity_logging.sql
      - ./schemas/stored_procedures/12_activity_context.sql:/docker-entrypoint-initdb.d/21_sp_12_activity_context.sql
      - ./schemas/stored_procedures/13_api_keys.sql:/docker-entrypoint-initdb.d/22_sp_13_api_keys.sql
      - ./schemas/stored_procedures/14_email_activation.sql:/docker-entrypoint-initdb.d/23_sp_14_email_activation.sql
      - ./schemas/stored_procedures/15_external_accounts.sql:/docker-entrypoint-initdb.d/24_sp_15_external_accounts.sql
      - ./schemas/stored_procedures/16_patreon_entitlements.sql:/docker-entrypoint-initdb.d/25_sp_16_patreon_entitlements.sql
      - ./schemas/triggers/01_activity_logging_triggers.sql:/docker-entrypoint-initdb.d/30_tr_01_activity_logging.sql
      - ./schemas/triggers/02_permission_activity_triggers.sql:/docker-entrypoint-initdb.d/31_tr_02_permission_activity.sql
      - ./schemas/triggers/03_api_key_activity_triggers.sql:/docker-entrypoint-initdb.d/32_tr_03_api_key_activity.sql
      - ./schemas/triggers/04_email_activation_triggers.sql:/docker-entrypoint-initdb.d/33_tr_04_email_activation.sql
      - ./schemas/triggers/05_external_accounts_triggers.sql:/docker-entrypoint-initdb.d/34_tr_05_external_accounts.sql
      - ./schemas/triggers/06_patreon_entitlements_triggers.sql:/docker-entrypoint-initdb.d/35_tr_06_patreon_entitlements.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest_root"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis-test:
    image: redis:7-alpine
    container_name: api-auth-redis-test
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit-test:
    image: axllent/mailpit:latest
    container_name: api-auth-mailpit-test
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"

  e2e-runner:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    image: api-auth-e2e:py312
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mailpit-test:
        condition: service_started
    env_file:
      - .env.test
    environment:
      DB_HOST: mysql-test
      DB_PORT: "3306"
      REDIS_HOST: redis-test
      REDIS_PORT: "6379"
      REAL_DB_HOST: mysql-test
      REAL_DB_PORT: "3306"
      REAL_DB_USER: test_user
      REAL_DB_PASSWORD: test_mysql_password
      REAL_DB_NAME: magic_auth
      REAL_REDIS_HOST: redis-test
      REAL_REDIS_PORT: "6379"
      E2E_SERVICE_WAIT_SECONDS: "120"
      EMAIL_DELIVERY_ENABLED: "true"
      EMAIL_PROVIDER: mailpit
      EMAIL_ALLOW_REAL_SEND_IN_TESTS: "false"
      RESEND_API_KEY: ""
      MAILPIT_SMTP_HOST: mailpit-test
      MAILPIT_SMTP_PORT: "1025"
      MAILPIT_API_BASE_URL: http://mailpit-test:8025
      # Patreon test placeholders are fake and disabled by default. Never put real
      # creator/member secrets in docker-compose.test.yml.
      PATREON_LINKING_ENABLED: "false"
      PATREON_WEBHOOKS_ENABLED: "false"
      PATREON_SYNC_ENABLED: "false"
      PATREON_S2S_ENTITLEMENT_ENABLED: "false"
      PATREON_RAW_PAYLOAD_CAPTURE_ENABLED: "false"
      PATREON_CREATOR_ACCESS_TOKEN: ""
      PATREON_CREATOR_REFRESH_TOKEN: ""
      PATREON_CLIENT_ID: "fake-patreon-client-id-for-tests"
      PATREON_CLIENT_SECRET: ""
      PATREON_WEBHOOK_SECRET: "fake-patreon-webhook-secret-for-tests"
      PATREON_ID_HMAC_SECRET: "fake-patreon-id-hmac-secret-for-tests"
      PATREON_PROOF_TOKEN_PEPPER: "fake-patreon-proof-token-pepper-for-tests"
      PATREON_S2S_BEARER_TOKEN: "fake-patreon-s2s-bearer-token-for-tests"
      PATREON_TIER_MAP_JSON: "[]"
      RUN_PATREON_LOCAL_E2E: "false"
      RUN_PATREON_E2E: "false"
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["python", "-m", "pytest", "tests/e2e"]
