[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --tb=short

markers =
    real_db: needs a live MySQL 8.0 (docker compose -f docker-compose.test.yml up -d); skipped otherwise
    unit: isolated unit test
    integration: ASGI, adapter, or component integration test
    e2e: end-to-end or high-fidelity lifecycle test
    static: source, schema, or documentation contract test
    live_provider: opt-in test that can contact an external provider
    large_payload: memory-sensitive payload test that must run alone

# Safety rails live in tests/conftest.py and are tunable by env var:
#
#   PYTEST_MEM_LIMIT_MB     (default 1536) address-space cap
#   PYTEST_TIMEOUT_SECONDS  (default 60)   per-test wall clock
#
# They exist because this suite drives real src/Util/db code against cursor doubles,
# and that code drains result sets with `while cur.nextset():`.  A double that does
# not stub nextset() never leaves that loop and allocates until the machine swaps.
# tests/support.py stops that at the source; the certified runners require positive
# bounded values so the next such bug fails a test instead of taking the box down.
